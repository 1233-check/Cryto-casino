<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgLimbo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgLimbo)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Multiplier Scale Lines -->
  <line x1="50" y1="50" x2="130" y2="50" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="140" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748B">100.00×</text>

  <line x1="50" y1="95" x2="130" y2="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="140" y="99" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748B">10.00×</text>

  <line x1="50" y1="140" x2="130" y2="140" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="140" y="144" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748B">2.00×</text>

  <!-- Big Target Multiplier -->
  <g transform="translate(195, 60)">
    <rect x="0" y="0" width="85" height="85" rx="16" fill="#181D28" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <path d="M 42 22 L 56 36 L 46 36 L 46 62 L 38 62 L 38 36 L 28 36 Z" fill="#10B981" />
  </g>

  <!-- Value Pill -->
  <rect x="185" y="135" width="105" height="26" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
  <text x="237" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#10B981">1,000,000×</text>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">LIMBO</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
