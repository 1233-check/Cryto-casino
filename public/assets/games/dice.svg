<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgDice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="diceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="100%" stop-color="#12151D" />
    </linearGradient>
    <linearGradient id="diceGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="220" rx="16" fill="url(#bgDice)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Background subtle circle aura -->
  <circle cx="160" cy="100" r="70" fill="#10B981" opacity="0.04" />

  <!-- Die 1 (Primary Emerald Die) -->
  <g transform="translate(110, 60)">
    <rect x="0" y="0" width="68" height="68" rx="12" fill="url(#diceGrad2)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <!-- Pips for 5 -->
    <circle cx="18" cy="18" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="18" r="4.5" fill="#FFFFFF" />
    <circle cx="34" cy="34" r="4.5" fill="#FFFFFF" />
    <circle cx="18" cy="50" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Die 2 (Obsidian Matte Die - angled) -->
  <g transform="translate(175, 85) rotate(16)">
    <rect x="0" y="0" width="58" height="58" rx="10" fill="url(#diceGrad1)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <!-- Pips for 4 -->
    <circle cx="16" cy="16" r="3.8" fill="#10B981" />
    <circle cx="42" cy="16" r="3.8" fill="#10B981" />
    <circle cx="16" cy="42" r="3.8" fill="#10B981" />
    <circle cx="42" cy="42" r="3.8" fill="#10B981" />
  </g>

  <!-- Target Roll Badge -->
  <rect x="120" y="148" width="80" height="24" rx="6" fill="#1A1F2B" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="160" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#94A3B8">&lt; 50.50 (2.00×)</text>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">DICE</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
