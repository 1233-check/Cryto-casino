<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgMines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="mineMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="220" rx="16" fill="url(#bgMines)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Micro 5x5 Grid Ghost in Background -->
  <g opacity="0.1" transform="translate(60, 45)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="24" y="0" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="48" y="0" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="0" y="24" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="24" y="24" width="18" height="18" rx="4" fill="#10B981" opacity="0.8" />
    <rect x="48" y="24" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="0" y="48" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="24" y="48" width="18" height="18" rx="4" fill="#FFFFFF" />
    <rect x="48" y="48" width="18" height="18" rx="4" fill="#EF4444" opacity="0.8" />
  </g>

  <!-- Cut Diamond Gem (Left) -->
  <g transform="translate(90, 60)">
    <!-- Gem Facets -->
    <polygon points="35,10 55,25 45,65 25,65 15,25" fill="url(#gemGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <polygon points="35,10 15,25 25,65" fill="#059669" opacity="0.7" />
    <polygon points="35,10 55,25 45,65" fill="#34D399" opacity="0.6" />
    <polygon points="25,25 45,25 35,65" fill="#10B981" />
  </g>

  <!-- Naval Mine (Right) -->
  <g transform="translate(195, 95)">
    <!-- Spikes -->
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="-22" y1="22" x2="22" y2="-22" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Spherical Hull -->
    <circle cx="0" cy="0" r="22" fill="url(#mineMetal)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <!-- Flashing Warning LED -->
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Multiplier Badge -->
  <rect x="120" y="148" width="80" height="24" rx="6" fill="#1A1F2B" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="160" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#10B981">GEMS &amp; MINES</text>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">MINES</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
