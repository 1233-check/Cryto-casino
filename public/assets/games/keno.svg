<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgKeno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="ballGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ballGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgKeno)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Lottery Balls Cluster -->
  <!-- Ball 7 (Emerald) -->
  <g transform="translate(110, 65)">
    <circle cx="22" cy="22" r="22" fill="url(#ballGreen)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="22" cy="22" r="13" fill="#FFFFFF" opacity="0.9" />
    <text x="22" y="27" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="14" fill="#065F46">07</text>
  </g>

  <!-- Ball 18 (Gold) -->
  <g transform="translate(160, 50)">
    <circle cx="24" cy="24" r="24" fill="url(#ballGold)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="24" cy="24" r="14" fill="#FFFFFF" opacity="0.9" />
    <text x="24" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="14" fill="#92400E">18</text>
  </g>

  <!-- Ball 24 (Obsidian/Blue) -->
  <g transform="translate(135, 100)">
    <circle cx="20" cy="20" r="20" fill="#3B82F6" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <circle cx="20" cy="20" r="12" fill="#FFFFFF" opacity="0.9" />
    <text x="20" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="13" fill="#1E40AF">24</text>
  </g>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">KENO</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
