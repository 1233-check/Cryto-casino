<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgBlackjack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgBlackjack)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Felt Circle Arc Background -->
  <path d="M 60 160 Q 160 40, 260 160" stroke="#1E293B" stroke-width="3" stroke-dasharray="6 6" fill="none" />

  <!-- Card 1: Ace of Spades -->
  <g transform="translate(100, 42) rotate(-8)">
    <rect width="68" height="100" rx="8" fill="#F8FAFC" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="18" fill="#0F172A">A</text>
    <!-- Spade Symbol -->
    <path d="M 34 50 C 31 43 22 50 25 56 C 28 62 34 68 34 68 C 34 68 40 62 43 56 C 46 50 37 43 34 50 Z" fill="#0F172A" />
    <path d="M 32 66 L 36 66 L 35 73 L 33 73 Z" fill="#0F172A" />
  </g>

  <!-- Card 2: Jack of Clubs -->
  <g transform="translate(155, 45) rotate(10)">
    <rect width="68" height="100" rx="8" fill="#F8FAFC" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="18" fill="#0F172A">J</text>
    <!-- Club Symbol -->
    <circle cx="34" cy="52" r="6" fill="#0F172A" />
    <circle cx="27" cy="60" r="6" fill="#0F172A" />
    <circle cx="41" cy="60" r="6" fill="#0F172A" />
    <path d="M 32 62 L 36 62 L 35 71 L 33 71 Z" fill="#0F172A" />
  </g>

  <!-- 21 Badge in Bottom Center -->
  <rect x="135" y="146" width="50" height="24" rx="6" fill="#10B981" />
  <text x="160" y="163" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="13" fill="#064E3B">21</text>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">BLACKJACK</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99.5% RTP</text>
</svg>
