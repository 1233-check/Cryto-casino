<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgHilo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgHilo)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Card 1: 8 of Spades (Center Left) -->
  <g transform="translate(90, 45) rotate(-6)">
    <rect width="66" height="96" rx="8" fill="#F8FAFC" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="18" fill="#0F172A">8</text>
    <path d="M 33 46 C 30 40 22 46 25 52 C 28 58 33 64 33 64 C 33 64 38 58 41 52 C 44 46 36 40 33 46 Z" fill="#0F172A" />
  </g>

  <!-- Card 2: King of Hearts (Center Right) -->
  <g transform="translate(160, 48) rotate(8)">
    <rect width="66" height="96" rx="8" fill="#F8FAFC" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="18" fill="#EF4444">K</text>
    <!-- Heart symbol -->
    <path d="M 33 50 C 33 50 25 42 22 47 C 19 52 23 58 33 66 C 43 58 47 52 44 47 C 41 42 33 50 33 50 Z" fill="#EF4444" />
  </g>

  <!-- High / Low Indicators -->
  <g transform="translate(130, 148)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="#10B981" />
    <path d="M 14 5 L 20 13 L 8 13 Z" fill="#0F172A" />
    
    <rect x="34" y="0" width="28" height="20" rx="4" fill="#EF4444" />
    <path d="M 48 15 L 42 7 L 54 7 Z" fill="#0F172A" />
  </g>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">HILO</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
