<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgRoulette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgRoulette)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Roulette Wheel (Center) -->
  <g transform="translate(160, 95)">
    <!-- Outer Mahogany Rim -->
    <circle cx="0" cy="0" r="66" fill="#1C1815" stroke="url(#brassGrad)" stroke-width="2" />
    
    <!-- Track Ring -->
    <circle cx="0" cy="0" r="54" fill="#0F172A" stroke="#334155" stroke-width="1" />

    <!-- Alternating Pockets (Segmented representation) -->
    <path d="M 0 0 L -12 -52 A 52 52 0 0 1 12 -52 Z" fill="#10B981" /> <!-- 0 Green -->
    <path d="M 0 0 L 12 -52 A 52 52 0 0 1 34 -40 Z" fill="#EF4444" /> <!-- Red -->
    <path d="M 0 0 L 34 -40 A 52 52 0 0 1 50 -18 Z" fill="#181D28" /> <!-- Black -->
    <path d="M 0 0 L 50 -18 A 52 52 0 0 1 52 12 Z" fill="#EF4444" />
    <path d="M 0 0 L 52 12 A 52 52 0 0 1 36 38 Z" fill="#181D28" />
    <path d="M 0 0 L 36 38 A 52 52 0 0 1 12 50 Z" fill="#EF4444" />
    <path d="M 0 0 L 12 50 A 52 52 0 0 1 -14 50 Z" fill="#181D28" />
    <path d="M 0 0 L -14 50 A 52 52 0 0 1 -38 36 Z" fill="#EF4444" />
    <path d="M 0 0 L -38 36 A 52 52 0 0 1 -52 10 Z" fill="#181D28" />
    <path d="M 0 0 L -52 10 A 52 52 0 0 1 -48 -20 Z" fill="#EF4444" />
    <path d="M 0 0 L -48 -20 A 52 52 0 0 1 -12 -52 Z" fill="#181D28" />

    <!-- Center Turret Brass Cone -->
    <circle cx="0" cy="0" r="22" fill="url(#brassGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="0" cy="0" r="10" fill="#181D28" />
    <circle cx="0" cy="0" r="4" fill="url(#brassGrad)" />

    <!-- Ivory Ball in Pocket -->
    <circle cx="4" cy="-45" r="4.5" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
  </g>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">ROULETTE</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">97.3% RTP</text>
</svg>
