<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgBaccarat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgBaccarat)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Player / Banker Cards -->
  <g transform="translate(85, 45)">
    <!-- Player Card -->
    <rect x="0" y="0" width="64" height="92" rx="8" fill="#F8FAFC" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="10" y="22" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="16" fill="#3B82F6">P</text>
    <text x="32" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="28" fill="#3B82F6">8</text>
  </g>

  <g transform="translate(170, 45)">
    <!-- Banker Card (Natural 9) -->
    <rect x="0" y="0" width="64" height="92" rx="8" fill="#F8FAFC" stroke="rgba(255,255,255,0.2)" stroke-width="1" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <text x="10" y="22" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="16" fill="#EF4444">B</text>
    <text x="32" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="28" fill="#EF4444">9</text>
  </g>

  <!-- Banker Win Natural Pill -->
  <rect x="110" y="148" width="100" height="24" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.3" stroke-width="1" />
  <text x="160" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="11" fill="#EF4444">NATURAL 9</text>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">BACCARAT</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">98.9% RTP</text>
</svg>
