<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgSlots" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgSlots)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- 3 Reels Chassis -->
  <g transform="translate(65, 45)">
    <!-- Reel Frame -->
    <rect x="0" y="0" width="190" height="90" rx="12" fill="#1C212E" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <!-- Reel 1 -->
    <rect x="12" y="10" width="50" height="70" rx="6" fill="#12151D" />
    <text x="37" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="900" font-size="42" fill="url(#goldText)">7</text>

    <!-- Reel 2 -->
    <rect x="70" y="10" width="50" height="70" rx="6" fill="#12151D" />
    <text x="95" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="900" font-size="42" fill="url(#goldText)">7</text>

    <!-- Reel 3 -->
    <rect x="128" y="10" width="50" height="70" rx="6" fill="#12151D" />
    <text x="153" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="900" font-size="42" fill="url(#goldText)">7</text>

    <!-- Win Payline Bar -->
    <line x1="5" y1="45" x2="185" y2="45" stroke="#10B981" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
  </g>

  <!-- Jackpot Badge -->
  <rect x="110" y="148" width="100" height="24" rx="6" fill="#D4AF37" fill-opacity="0.15" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1" />
  <text x="160" y="164" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="11" fill="#D4AF37">JACKPOT 777</text>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">SLOTS</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">96.5% RTP</text>
</svg>
