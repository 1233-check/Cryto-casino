<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgPlinko" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="puckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgPlinko)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Peg Pyramid -->
  <g fill="#94A3B8" opacity="0.6">
    <!-- Row 1 -->
    <circle cx="160" cy="40" r="3" />
    <!-- Row 2 -->
    <circle cx="145" cy="60" r="3" />
    <circle cx="175" cy="60" r="3" />
    <!-- Row 3 -->
    <circle cx="130" cy="80" r="3" />
    <circle cx="160" cy="80" r="3" />
    <circle cx="190" cy="80" r="3" />
    <!-- Row 4 -->
    <circle cx="115" cy="100" r="3" />
    <circle cx="145" cy="100" r="3" />
    <circle cx="175" cy="100" r="3" />
    <circle cx="205" cy="100" r="3" />
    <!-- Row 5 -->
    <circle cx="100" cy="120" r="3" />
    <circle cx="130" cy="120" r="3" />
    <circle cx="160" cy="120" r="3" />
    <circle cx="190" cy="120" r="3" />
    <circle cx="220" cy="120" r="3" />
  </g>

  <!-- Golden Puck Falling Through Board -->
  <circle cx="172" cy="74" r="7.5" fill="url(#puckGrad)" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Multiplier Bins at Bottom -->
  <g transform="translate(75, 145)">
    <rect x="0" y="0" width="22" height="14" rx="3" fill="#EF4444" />
    <text x="11" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">16x</text>

    <rect x="25" y="0" width="22" height="14" rx="3" fill="#F59E0B" />
    <text x="36" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">9x</text>

    <rect x="50" y="0" width="22" height="14" rx="3" fill="#10B981" />
    <text x="61" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">2x</text>

    <rect x="75" y="0" width="20" height="14" rx="3" fill="#64748B" />
    <text x="85" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">0.2</text>

    <rect x="98" y="0" width="22" height="14" rx="3" fill="#10B981" />
    <text x="109" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">2x</text>

    <rect x="123" y="0" width="22" height="14" rx="3" fill="#F59E0B" />
    <text x="134" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">9x</text>

    <rect x="148" y="0" width="22" height="14" rx="3" fill="#EF4444" />
    <text x="159" y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-size="8" font-weight="700" fill="#FFFFFF">16x</text>
  </g>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">PLINKO</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
