<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgTrade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgTrade)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Candlesticks in Background -->
  <g transform="translate(45, 45)">
    <!-- Candle 1: Green -->
    <line x1="20" y1="20" x2="20" y2="75" stroke="#10B981" stroke-width="1.5" />
    <rect x="14" y="32" width="12" height="30" rx="2" fill="#10B981" />

    <!-- Candle 2: Red -->
    <line x1="45" y1="28" x2="45" y2="85" stroke="#EF4444" stroke-width="1.5" />
    <rect x="39" y="40" width="12" height="32" rx="2" fill="#EF4444" />

    <!-- Candle 3: Green -->
    <line x1="70" y1="15" x2="70" y2="70" stroke="#10B981" stroke-width="1.5" />
    <rect x="64" y="24" width="12" height="35" rx="2" fill="#10B981" />

    <!-- Candle 4: Violet (Hybrid) -->
    <line x1="95" y1="10" x2="95" y2="60" stroke="#8B5CF6" stroke-width="1.5" />
    <rect x="89" y="18" width="12" height="28" rx="2" fill="#8B5CF6" />
  </g>

  <!-- Color Trading Chips in Foreground -->
  <g transform="translate(180, 70)">
    <!-- Green Token -->
    <circle cx="18" cy="18" r="18" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    <text x="18" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="12" fill="#064E3B">2x</text>

    <!-- Violet Token -->
    <circle cx="50" cy="8" r="16" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2" />
    <text x="50" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="11" fill="#FFFFFF">4.5x</text>

    <!-- Red Token -->
    <circle cx="80" cy="24" r="18" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
    <text x="80" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui" font-weight="800" font-size="12" fill="#FFFFFF">2x</text>
  </g>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">COLOR TRADING</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">98% RTP</text>
</svg>
