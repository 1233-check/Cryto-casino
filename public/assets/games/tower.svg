<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="bgTower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <linearGradient id="tierActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#bgTower)" />
  <rect width="320" height="220" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Fortress Citadel Tower Ascending Tiers -->
  <g transform="translate(100, 35)">
    <!-- Apex Crown / Chest -->
    <rect x="42" y="0" width="36" height="20" rx="4" fill="#D4AF37" stroke="rgba(255,255,255,0.2)" />
    <circle cx="60" cy="10" r="3" fill="#141822" />

    <!-- Tier 4 (Top) -->
    <rect x="30" y="24" width="60" height="22" rx="4" fill="#222736" stroke="rgba(255,255,255,0.08)" />
    <circle cx="48" cy="35" r="3.5" fill="#64748B" />
    <circle cx="72" cy="35" r="3.5" fill="#64748B" />

    <!-- Tier 3 -->
    <rect x="22" y="50" width="76" height="22" rx="4" fill="#222736" stroke="rgba(255,255,255,0.08)" />
    <circle cx="36" cy="61" r="3.5" fill="#64748B" />
    <circle cx="60" cy="61" r="3.5" fill="#64748B" />
    <circle cx="84" cy="61" r="3.5" fill="#64748B" />

    <!-- Tier 2 (Current Cleared Tier - Emerald) -->
    <rect x="14" y="76" width="92" height="22" rx="4" fill="url(#tierActive)" stroke="rgba(255,255,255,0.2)" />
    <circle cx="32" cy="87" r="3.5" fill="#FFFFFF" />
    <circle cx="60" cy="87" r="3.5" fill="#FFFFFF" />
    <circle cx="88" cy="87" r="3.5" fill="#FFFFFF" />

    <!-- Tier 1 (Base Tier) -->
    <rect x="6" y="102" width="108" height="24" rx="4" fill="#181D28" stroke="rgba(255,255,255,0.08)" />
    <circle cx="28" cy="114" r="3.5" fill="#10B981" />
    <circle cx="60" cy="114" r="3.5" fill="#10B981" />
    <circle cx="92" cy="114" r="3.5" fill="#10B981" />
  </g>

  <!-- Title Watermark -->
  <text x="28" y="194" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="0.08em" fill="#64748B">TOWER</text>
  <text x="292" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">99% RTP</text>
</svg>
